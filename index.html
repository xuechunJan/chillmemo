<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freeform Reading Canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07080b;
        --ink: #f4f1e8;
        --muted: #a8a29a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 16% 18%, rgba(84, 120, 128, 0.18), transparent 28rem),
          radial-gradient(circle at 82% 78%, rgba(128, 88, 68, 0.14), transparent 30rem),
          linear-gradient(135deg, #07080b 0%, #101116 48%, #08090d 100%);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
      }

      .viewport {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 25;
        width: 176px;
        height: 148px;
        overflow: hidden;
        border-radius: 12px;
        cursor: default;
        opacity: 0.98;
        transition:
          width 620ms cubic-bezier(0.2, 0.8, 0.18, 1),
          height 620ms cubic-bezier(0.2, 0.8, 0.18, 1),
          border-radius 620ms cubic-bezier(0.2, 0.8, 0.18, 1),
          opacity 260ms ease;
        will-change: width, height;
      }

      .viewport.is-expanded,
      .viewport.is-expanding {
        left: 22px;
        top: 22px;
        width: auto;
        height: auto;
        border-radius: 18px;
        cursor: grab;
      }

      .viewport.is-collapsing {
        cursor: default;
      }

      .viewport.is-dragging {
        cursor: grabbing;
      }

      .canvas {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 3000px;
        height: 2000px;
        transform: translate3d(-1450px, -760px, 0);
        transform-style: flat;
        will-change: transform;
      }

      .canvas::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 120px 120px;
        mask-image: radial-gradient(circle at center, black 0%, transparent 78%);
        opacity: 0.34;
      }

      .card {
        position: absolute;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: rgba(22, 24, 29, 0.88);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
        color: var(--ink);
        backdrop-filter: blur(18px);
        opacity: var(--card-opacity, 1);
        pointer-events: var(--card-pointer-events, auto);
        transform: translate3d(var(--stack-x, 0px), var(--stack-y, 0px), 0)
          rotate(var(--active-r, var(--r, 0deg))) scale(var(--active-s, var(--s, 1)));
        transform-origin: center;
        transition:
          transform 620ms cubic-bezier(0.2, 0.82, 0.18, 1),
          opacity 420ms ease,
          box-shadow 180ms ease,
          border-color 180ms ease;
        will-change: transform;
      }

      .viewport.is-expanded .card:hover {
        z-index: 20;
        transform: translate3d(var(--stack-x, 0px), var(--stack-y, 0px), 0)
          rotate(var(--active-r, var(--r, 0deg))) scale(calc(var(--active-s, var(--s, 1)) + 0.035));
        border-color: transparent;
        box-shadow: none;
      }

      .viewport.is-expanded .card.is-element-dragging {
        cursor: grabbing;
        transition:
          transform 180ms cubic-bezier(0.2, 1.4, 0.24, 1),
          filter 180ms ease;
        filter:
          drop-shadow(0 0 14px rgba(245, 245, 245, 0.66))
          drop-shadow(0 0 2px rgba(32, 32, 32, 0.78))
          drop-shadow(0 20px 30px rgba(0, 0, 0, 0.34));
      }

      .viewport.is-collapsed .card {
        transition-duration: 560ms;
      }

      .viewport.is-collapsed .card,
      .viewport.is-collapsing .card,
      .viewport.is-expanding .card,
      .viewport.is-expanded .card {
        overflow: visible;
        border-color: transparent;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
      }

      .viewport.is-collapsed.is-add-choosing {
        width: 300px !important;
        height: 180px !important;
      }

      .card.is-hidden-in-stack {
        display: none;
      }

      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 42%);
        opacity: 0.38;
      }

      .viewport.is-collapsed .card::after,
      .viewport.is-collapsing .card::after,
      .viewport.is-expanding .card::after,
      .viewport.is-expanded .card::after {
        display: none;
      }

      .sticky-shape,
      .taped-shape {
        position: absolute;
        inset: 0;
        display: none;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
        filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.34));
      }

      .viewport.is-collapsed .sticky-shape,
      .viewport.is-collapsing .sticky-shape {
        display: block;
      }

      .viewport.is-collapsed.is-limit-stack .sticky-shape,
      .viewport.is-collapsing.is-limit-stack .sticky-shape {
        display: none;
      }

      .viewport.is-expanding .taped-shape,
      .viewport.is-expanded .taped-shape {
        display: block;
        filter: drop-shadow(0 20px 28px rgba(0, 0, 0, 0.38));
        transition: filter 180ms ease;
      }

      .viewport.is-collapsed.is-limit-stack .taped-shape,
      .viewport.is-collapsing.is-limit-stack .taped-shape {
        display: block;
        filter: drop-shadow(0 14px 20px rgba(0, 0, 0, 0.38));
      }

      .viewport.is-expanded .card:hover .taped-shape {
        filter:
          drop-shadow(0 0 12px rgba(245, 245, 245, 0.58))
          drop-shadow(0 0 2px rgba(28, 28, 28, 0.72))
          drop-shadow(0 18px 28px rgba(0, 0, 0, 0.34));
      }

      .add-plus {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 80;
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
        cursor: pointer;
        font-size: 22px;
        line-height: 1;
        opacity: 0;
        pointer-events: auto;
        transform: translate(-50%, -50%) scale(0.84);
        transition:
          opacity 160ms ease,
          transform 160ms ease,
          filter 160ms ease;
      }

      .viewport.is-collapsed:not(.is-add-choosing):hover .add-plus {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      .viewport.is-collapsed.is-add-choosing .add-plus,
      .viewport.is-expanding .add-plus,
      .viewport.is-expanded .add-plus,
      .viewport.is-collapsing .add-plus {
        pointer-events: none;
      }

      .add-plus:hover {
        filter:
          drop-shadow(0 0 10px rgba(245, 245, 245, 0.66))
          drop-shadow(0 0 2px rgba(28, 28, 28, 0.72));
      }

      .photo-input {
        position: fixed;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .limit-toast {
        position: fixed;
        left: 50%;
        bottom: 34px;
        z-index: 120;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(18, 18, 22, 0.9);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.38);
        color: rgba(255, 250, 230, 0.96);
        font-size: 14px;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 10px) scale(0.98);
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }

      .limit-toast.is-visible {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }

      .editor-layer,
      .polaroid-photo {
        position: absolute;
        display: none;
        pointer-events: auto;
      }

      .viewport.is-expanded .card.is-added-sticky .editor-layer {
        display: block;
        left: 16%;
        top: 18%;
        width: 68%;
        height: 56%;
        resize: none;
        border: 0;
        outline: none;
        background: transparent;
        color: rgba(32, 26, 36, 0.86);
        font: 18px/1.45 Georgia, "Times New Roman", serif;
        overflow: hidden;
        padding: 18px;
      }

      .viewport.is-expanded .card.is-added-polaroid .polaroid-photo {
        display: block;
        left: 3.8%;
        top: 2.9%;
        width: 92.4%;
        height: 79.9%;
        object-fit: contain;
      }

      .card-visual {
        min-height: 46%;
        background:
          radial-gradient(circle at 24% 24%, rgba(255, 255, 255, 0.42), transparent 12%),
          linear-gradient(135deg, var(--a), var(--b) 48%, var(--c));
      }

      .viewport.is-collapsed .card-visual,
      .viewport.is-collapsing .card-visual,
      .viewport.is-expanding .card-visual,
      .viewport.is-expanded .card-visual {
        display: none;
      }

      .card-body {
        position: relative;
        z-index: 1;
        padding: 18px;
      }

      .viewport.is-collapsed .card-body,
      .viewport.is-collapsing .card-body,
      .viewport.is-expanding .card-body,
      .viewport.is-expanded .card-body {
        display: none;
      }

      .card-kicker {
        margin-bottom: 10px;
        color: rgba(244, 241, 232, 0.56);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .viewport.is-collapsed .card-kicker,
      .viewport.is-collapsing .card-kicker,
      .viewport.is-expanding .card-kicker,
      .viewport.is-expanded .card-kicker {
        margin-bottom: 7px;
        color: rgba(48, 35, 56, 0.58);
        font-size: 10px;
        letter-spacing: 0.08em;
      }

      .card-title {
        margin: 0 0 12px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(20px, 2.3vw, 31px);
        line-height: 1.02;
        letter-spacing: 0;
      }

      .viewport.is-collapsed .card-title,
      .viewport.is-collapsing .card-title,
      .viewport.is-expanding .card-title,
      .viewport.is-expanded .card-title {
        margin-bottom: 6px;
        color: rgba(31, 24, 35, 0.9);
        font-size: 25px;
        line-height: 0.95;
      }

      .card-text {
        margin: 0;
        color: rgba(244, 241, 232, 0.72);
        font-size: 14px;
        line-height: 1.55;
      }

      .viewport.is-collapsed .card-text,
      .viewport.is-collapsing .card-text,
      .viewport.is-expanding .card-text,
      .viewport.is-expanded .card-text {
        max-width: 16ch;
        color: rgba(36, 29, 40, 0.62);
        font-size: 12px;
        line-height: 1.25;
      }

      .viewport.is-expanding .card-body,
      .viewport.is-expanded .card-body {
        justify-content: flex-start;
        padding: 54px 34px 28px 34px;
      }

      .viewport.is-expanding .card-kicker,
      .viewport.is-expanded .card-kicker {
        color: rgba(49, 39, 54, 0.54);
      }

      .viewport.is-expanding .card-title,
      .viewport.is-expanded .card-title {
        font-size: clamp(22px, 2vw, 30px);
      }

      .viewport.is-expanding .card-text,
      .viewport.is-expanded .card-text {
        max-width: 24ch;
        font-size: 14px;
        line-height: 1.45;
      }

      .preview {
        pointer-events: none;
        opacity: 0;
        transform: translateY(14px) scale(0.98);
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }

      .preview.is-open {
        pointer-events: auto;
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .veil {
        pointer-events: none;
        background:
          linear-gradient(90deg, rgba(7, 8, 11, 0.96), transparent 13%, transparent 87%, rgba(7, 8, 11, 0.96)),
          linear-gradient(0deg, rgba(7, 8, 11, 0.96), transparent 16%, transparent 84%, rgba(7, 8, 11, 0.96));
      }

      @media (max-width: 680px) {
        .viewport {
          right: 14px;
          bottom: 14px;
        }

        .viewport.is-expanded,
        .viewport.is-expanding {
          left: 14px;
          top: 14px;
          width: auto;
          height: auto;
        }
      }

      #viewport.viewport.is-collapsed,
      #viewport.viewport.is-collapsing {
        width: 176px !important;
        height: 148px !important;
      }

      #viewport.viewport.is-collapsed.is-add-choosing {
        width: 300px !important;
        height: 180px !important;
      }

      #viewport.viewport.is-expanded,
      #viewport.viewport.is-expanding {
        left: 22px !important;
        top: 22px !important;
        width: auto !important;
        height: auto !important;
      }

      @media (max-width: 680px) {
        #viewport.viewport.is-collapsed,
        #viewport.viewport.is-collapsing {
          width: 156px !important;
          height: 132px !important;
        }

        #viewport.viewport.is-collapsed.is-add-choosing {
          width: 286px !important;
          height: 172px !important;
        }

        #viewport.viewport.is-expanded,
        #viewport.viewport.is-expanding {
          left: 14px !important;
          top: 14px !important;
          width: auto !important;
          height: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="viewport" class="viewport" aria-label="Freeform swipeable reading canvas">
      <section id="canvas" class="canvas" aria-live="polite"></section>
      <button id="addPlus" class="add-plus" type="button" aria-label="Add interaction">➕</button>
      <input id="photoInput" class="photo-input" type="file" accept="image/png,image/jpeg" tabindex="-1" />
    </main>
    <div id="limitToast" class="limit-toast" role="status" aria-live="polite">数量已达上限</div>

    <div class="veil fixed inset-0"></div>

    <header class="pointer-events-none fixed left-5 right-5 top-5 z-30 flex items-start justify-between gap-4 md:left-8 md:right-8 md:top-8">
      <div>
        <p class="mb-2 text-[11px] font-bold uppercase tracking-[0.2em] text-stone-400">Reading Field</p>
        <h1 class="max-w-[14rem] font-serif text-3xl leading-none text-stone-100 md:max-w-none md:text-5xl">
          Freeform fragments
        </h1>
      </div>
      <div class="hidden max-w-xs text-right text-sm leading-6 text-stone-400 md:block">
        Swipe, wheel, or drag the surface. Click any fragment to open a reading preview.
      </div>
    </header>

    <aside
      id="preview"
      class="preview fixed bottom-5 left-5 right-5 z-40 max-h-[68vh] overflow-auto rounded-lg border border-white/15 bg-[#111318]/95 p-5 shadow-2xl shadow-black/50 backdrop-blur-xl md:bottom-8 md:left-auto md:right-8 md:w-[440px] md:p-6"
      role="dialog"
      aria-modal="false"
      aria-labelledby="previewTitle"
    >
      <div class="mb-5 flex items-start justify-between gap-5">
        <div>
          <p id="previewKicker" class="mb-2 text-[11px] font-bold uppercase tracking-[0.2em] text-stone-500"></p>
          <h2 id="previewTitle" class="font-serif text-3xl leading-tight text-stone-100"></h2>
        </div>
        <button
          id="closePreview"
          class="pointer-events-auto grid h-9 w-9 shrink-0 place-items-center rounded-md border border-white/10 bg-white/5 text-xl leading-none text-stone-300 transition hover:bg-white/10"
          aria-label="Close preview"
        >
          &times;
        </button>
      </div>
      <p id="previewText" class="text-base leading-7 text-stone-300"></p>
    </aside>

    <script>
      const allCards = [
        ["Margin notes", "The page becomes a place when the eye can wander before it has to decide.", "Archive 01", 180, 110, 310, 250, -4, 1.02, "#344e41", "#6d9773", "#d9b26f"],
        ["Unfinished atlas", "Small entries hold together by proximity, not order; a thought can sit beside weather, a street, a quote.", "Field note", 620, 260, 260, 330, 3, 0.96, "#263238", "#476a6f", "#c9b99b"],
        ["Quiet index", "A scattered surface rewards partial attention. Reading becomes a search without a search box.", "Fragment", 1090, 80, 340, 230, -2, 1, "#394053", "#8b687f", "#e6c79c"],
        ["Blue hour", "The best fragment is not complete; it leaves enough room for the next one to change it.", "Observation", 1600, 210, 280, 330, 5, 1.01, "#1c3144", "#596f62", "#d8c99b"],
        ["Soft archive", "The surface remembers where things were, even when the path between them is improvised.", "Reading", 2110, 40, 330, 260, -5, 0.98, "#3f3f37", "#6b705c", "#cb997e"],
        ["Afterimage", "To browse is to make temporary constellations from things that were not waiting to become a list.", "Image note", 2600, 180, 260, 290, 2, 1.03, "#2b2d42", "#7d8597", "#d6ccc2"],
        ["Paper drift", "Each card is a stop, not a destination. The canvas should keep moving after the hand lets go.", "Motion", -130, 540, 330, 240, 4, 1, "#22333b", "#5e503f", "#eae0d5"],
        ["Slow looking", "Fragments need silence around them. The gaps are part of the interface.", "Essay", 360, 760, 280, 330, -3, 0.98, "#253237", "#5c6b73", "#c2dfe3"],
        ["Desk light", "A note seen at the edge can be more inviting than a note centered too politely.", "Clipping", 840, 620, 350, 250, 2, 1.01, "#3d405b", "#81b29a", "#f2cc8f"],
        ["Loose map", "Movement is a way of editing attention: keep the friction low, but never let it feel weightless.", "Prototype", 1330, 560, 300, 300, -4, 1.03, "#2f3e46", "#52796f", "#cad2c5"],
        ["Threshold", "Some text belongs half outside the viewport, making the screen feel less like a page and more like a window.", "Viewport", 1840, 650, 360, 240, 5, 0.97, "#353535", "#7d6b58", "#d9cab3"],
        ["Cross current", "Diagonal gestures should not collapse into vertical habits. Let the hand draw its own route.", "Trackpad", 2350, 560, 300, 360, -2, 1, "#263a29", "#5f7a61", "#e1ca96"],
        ["Untitled receipt", "A dense sentence can become visual material when placed with enough air around it.", "Scan", 2920, 710, 300, 220, 3, 0.98, "#372f2f", "#8a5a44", "#d5bdaf"],
        ["Index card", "No snapping. The reader chooses when a fragment is centered, ignored, or revisited.", "Rule", 110, 1110, 280, 270, -1, 1.04, "#22223b", "#4a4e69", "#c9ada7"],
        ["Weather margin", "The canvas should feel physical without pretending to be dimensional.", "Surface", 560, 1200, 330, 230, 4, 0.96, "#2d3142", "#4f5d75", "#bfc0c0"],
        ["Open tab", "Reading systems often over-prescribe flow. This one only offers territory.", "Note", 1040, 1040, 290, 340, -5, 1, "#283618", "#606c38", "#dda15e"],
        ["Small signal", "A visual index can be sparse and still full, if every piece has room to register.", "Index", 1530, 1120, 340, 250, 2, 1.02, "#354f52", "#84a98c", "#cad2c5"],
        ["Side glance", "The edge of a card is an invitation to move, not an error to correct.", "Peripheral", 2060, 1060, 270, 330, -3, 0.98, "#3c1642", "#086375", "#affc41"],
        ["Folded quote", "A fragment should make enough sense alone and more sense when it drifts near another.", "Quote", 2540, 1120, 350, 260, 4, 1.01, "#243b4a", "#6a8d92", "#e0fbfc"],
        ["North room", "The canvas is larger than the argument. It can hold unfinished parts without making them provisional.", "Room", 3180, 1040, 260, 320, -4, 1, "#3a3042", "#5d5179", "#e5d4ed"],
        ["Long shelf", "Position is memory. Returning to a card should feel like finding it on a table.", "Memory", -220, 1560, 370, 250, 5, 0.99, "#2b2c28", "#5c574f", "#d6d1b1"],
        ["Faint title", "The eye likes variety: square, long, tall, bright, quiet, near, far.", "Composition", 290, 1650, 290, 300, -4, 1.02, "#473144", "#af1b3f", "#ccb69b"],
        ["Reading path", "There is no next card, only another possible card. The interface should preserve that ambiguity.", "Flow", 760, 1510, 350, 240, 2, 0.96, "#393e41", "#587b7f", "#f4f1bb"],
        ["Line break", "Fragments become legible through pace. Inertia supplies a small pause after action.", "Physics", 1280, 1530, 270, 340, -2, 1.04, "#222831", "#5b8e7d", "#f4d35e"],
        ["Near silence", "The dark field is not a backdrop; it is the distance between pieces.", "Space", 1740, 1580, 320, 250, 3, 0.98, "#202c39", "#658e9c", "#f6f4d2"],
        ["Found image", "A color block can stand in for a photograph when the prototype is about movement first.", "Placeholder", 2240, 1490, 290, 340, -5, 1, "#51291e", "#a63d40", "#e9b872"],
        ["Loose leaf", "When everything is reachable, order can become optional without becoming absent.", "Leaf", 2750, 1590, 350, 240, 4, 1.02, "#1f363d", "#40798c", "#cfe0c3"],
        ["Quiet proof", "A prototype is useful when its motion answers before the final frame does.", "Demo", 3340, 1500, 280, 300, -2, 0.97, "#30292f", "#413f54", "#d4bebe"],
        ["Late window", "A card half seen is a promise that the field continues beyond the screen.", "Edge", 430, -170, 320, 230, 3, 1, "#2f243a", "#444054", "#fac9b8"],
        ["Offset", "The reading field starts away from perfect center so the first movement already has context.", "Start", 1460, -140, 270, 300, -4, 1.03, "#1e2d2f", "#586f7c", "#b8dbd9"],
        ["Southern note", "The bottom edge should not feel like the bottom of a document.", "Boundary", 1980, 1910, 360, 220, 2, 0.98, "#2b2118", "#6f4e37", "#e0c097"],
        ["Far marker", "A distant fragment at the margin gives the surface a scale the viewport cannot show all at once.", "Scale", 3000, 1960, 330, 250, -3, 1, "#273043", "#9197ae", "#eff6ee"],
      ];
      const selectedCards = [
        ...allCards.slice(0, 7),
        ["Polaroid", "", "Photo", 0, 0, 240, 330, 2, 1, "#f7f2e7", "#ead8bd", "#ffffff"],
        ["Polaroid", "", "Photo", 0, 0, 240, 330, -2, 1, "#f7f2e7", "#ead8bd", "#ffffff"],
        ["Polaroid", "", "Photo", 0, 0, 240, 330, 1, 1, "#f7f2e7", "#ead8bd", "#ffffff"],
        ["Polaroid", "", "Photo", 0, 0, 240, 330, -1, 1, "#f7f2e7", "#ead8bd", "#ffffff"],
      ];
      const cards = selectedCards.map((card, index) => {
        const expandedPositions = [
          [1210, 600, 270, 300, -5, 1.02],
          [1430, 560, 306, 306, 4, 1.12],
          [1600, 650, 300, 280, -2, 1.01],

          card.style.setProperty("--active-s", scale);
          card.style.setProperty("--card-opacity", isVisible ? 1 : 0);
          card.style.setProperty("--card-pointer-events", isVisible ? "auto" : "none");
          card.style.opacity = isVisible ? "1" : "0";
          applyExpandedCardTransform(card, index);
          card.style.zIndex = index === activeCardIndex ? 90 : 20 + visibleIndexes.indexOf(index);
          card.tabIndex = isVisible ? 0 : -1;
          card.classList.toggle("is-hidden-in-stack", !isVisible);
        });
        syncAddInteractionClasses();

        if (commit) {
          void canvas.offsetWidth;
          [...canvas.children].forEach((card) => {
            card.style.transition = "";
          });
        }
      }

      function expandWidget() {
        if (state === "expanded" || state === "expanding") return;
        clearCollapseTimer();
        window.clearTimeout(expandTimer);
        randomizeExpandedLayout();
        setWidgetState("expanding");
        applyStackTransforms();
        void canvas.offsetWidth;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            applyExpandedTransforms();
          });
        });
        expandTimer = window.setTimeout(() => {
          if (state !== "expanding") return;
          setWidgetState("expanded");
          applyExpandedTransforms();
        }, expandDuration);
      }

      function collapseWidget() {
        if (isPhotoPickerOpen || performance.now() < preventCollapseUntil) return;
        if (state === "collapsed" || state === "collapsing") return;
        if (isDragging) {
          scheduleCollapse();
          return;
        }
        const wheelAge = performance.now() - lastWheelTime;
        if (wheelAge < wheelSettleDelay) {
          window.clearTimeout(collapseAfterWheelTimer);
          collapseAfterWheelTimer = window.setTimeout(collapseWidget, wheelSettleDelay - wheelAge);
          return;
        }

        hidePreview();
        velocityX = 0;
        velocityY = 0;
        targetVelocityX = 0;
        targetVelocityY = 0;
        randomizeStackOrder();
        setWidgetState("collapsing");
        applyStackTransforms();
        window.setTimeout(() => {
          if (state !== "collapsing") return;
          pickDefaultSticky();
          randomizeStackOrder();
          setWidgetState("collapsed");
          applyStackTransforms();
        }, collapseDuration);
      }

      function scheduleCollapse() {
        clearCollapseTimer();
        collapseTimer = window.setTimeout(collapseWidget, collapseDelay);
      }

      function scheduleInitialReset() {
        clearCollapseTimer();
        collapseTimer = window.setTimeout(() => {
          if (state === "collapsed" && addInteractionStage === "choosing") resetToInitialCollapsed();
        }, collapseDelay);
      }

      function scheduleReturnFromWidgetLeave() {
        if (state === "collapsed" && addInteractionStage === "choosing") {
          scheduleInitialReset();
        }
      }

      function isInsideViewport(clientX, clientY) {
        const rect = viewport.getBoundingClientRect();
        return clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom;
      }

      function isInsideActiveCard(clientX, clientY) {
        const activeCard = canvas.children[activeCardIndex];
        if (!activeCard) return false;
        const rect = activeCard.getBoundingClientRect();
        return clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom;
      }

      function isInsideAddedCard(clientX, clientY) {
        return addedCardIndexes.some((index) => {
          const card = canvas.children[index];
          if (!card || getComputedStyle(card).opacity === "0") return false;
          const rect = card.getBoundingClientRect();
          return clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom;
        });
      }

      function isPointInRect(clientX, clientY, rect) {
        return clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom;
      }

      function insetRect(rect, insetRatio) {
        const insetX = rect.width * insetRatio;
        const insetY = rect.height * insetRatio;
        return {
          left: rect.left + insetX,
          right: rect.right - insetX,
          top: rect.top + insetY,
          bottom: rect.bottom - insetY,
        };
      }

      function isPointOnVisibleElement(clientX, clientY) {
        return addedCardIndexes.some((index) => {
          const card = canvas.children[index];
          if (!card || getComputedStyle(card).opacity === "0") return false;

          const cardRect = card.getBoundingClientRect();
          const elementRect = insetRect(cardRect, activePolaroidSlots.includes(index) ? 0.02 : 0.08);
          if (!isPointInRect(clientX, clientY, elementRect)) return false;

          const editor = card.querySelector(".editor-layer");
          if (editor && getComputedStyle(editor).display !== "none" && isPointInRect(clientX, clientY, editor.getBoundingClientRect())) return true;

          const photo = card.querySelector(".polaroid-photo");
          if (photo && getComputedStyle(photo).display !== "none" && isPointInRect(clientX, clientY, photo.getBoundingClientRect())) return true;

          return true;
        });
      }

      function trackWidgetPointer(event) {
        currentPointerX = event.clientX;
        currentPointerY = event.clientY;

        if (state === "collapsed" && addInteractionStage === "choosing") {
          if (isInsideViewport(event.clientX, event.clientY)) {
            clearCollapseTimer();
            return;
          }
          scheduleInitialReset();
          return;
        }

        if (state === "expanded" || state === "expanding") {
          clearCollapseTimer();
          return;
        }
      }

      function beginChoosing(event) {
        event.stopPropagation();
        currentPointerX = event.clientX;
        currentPointerY = event.clientY;
        if (state !== "collapsed") return;
        if (isTotalLimitReached()) {
          showLimitToast();
          return;
        }
        addInteractionStage = "choosing";
        randomizeStackOrder();
        clearCollapseTimer();
        setWidgetState("collapsed");
        applyStackTransforms();
        window.setTimeout(() => {
          if (state === "collapsed" && addInteractionStage === "choosing") applyStackTransforms();
        }, 220);
      }

      function expandCollapsedStackFrom(index) {
        if (!shouldShowCollapsedStack() || !addedCardIndexes.includes(index)) return false;
        activeCardIndex = index;
        activeKind = activePolaroidSlots.includes(index) ? "polaroid" : "sticky";
        addInteractionStage = "selected";
        clearCollapseTimer();
        expandWidget();
        return true;
      }

      function expandExistingFromLimit(kind) {
        const slots = kind === "polaroid" ? activePolaroidSlots : activeStickySlots;
        const fallbackSlots = addedCardIndexes.length ? addedCardIndexes : [...activeStickySlots, ...activePolaroidSlots];
        const targetIndex = slots[slots.length - 1] ?? fallbackSlots[fallbackSlots.length - 1];
        if (targetIndex === undefined) return;

        activeCardIndex = targetIndex;
        activeKind = activePolaroidSlots.includes(targetIndex) ? "polaroid" : "sticky";
        addInteractionStage = "selected";
        clearCollapseTimer();
        expandWidget();
      }

      function handleCardClick(index, event) {
        currentPointerX = event.clientX;
        currentPointerY = event.clientY;
        const clickedCard = canvas.children[index];
        const clickedTapedSrc = clickedCard?.querySelector(".taped-shape")?.getAttribute("src") ?? "";
        const clickedStickySrc = clickedCard?.querySelector(".sticky-shape")?.getAttribute("src") ?? "";
        const isClickedPolaroid = clickedTapedSrc.includes("polaroid.svg") || clickedStickySrc.includes("polaroid.svg");
        const clickedVisibleElement = isPointOnVisibleElement(event.clientX, event.clientY);

        if (suppressNextBlankClick) {
          suppressNextBlankClick = false;
          event.stopPropagation();
          return;
        }

        if (event.target.closest(".editor-layer")) {
          event.stopPropagation();
          return;
        }

        if (state === "expanded" && !clickedVisibleElement) return;

        if (state === "collapsed" && addInteractionStage !== "choosing" && expandCollapsedStackFrom(index)) {
          event.stopPropagation();
          return;
        }

        if (state === "collapsed" && addInteractionStage === "choosing") {
          event.stopPropagation();
          if (index !== activeStickyIndex && index !== polaroidAssetIndex) return;
          activeKind = index === polaroidAssetIndex ? "polaroid" : "sticky";
          if (!addExpandedCard(activeKind, activeStickyAssetIndex)) {
            showLimitToast();
            expandExistingFromLimit(activeKind);
            return;
          }
          addInteractionStage = "selected";
          clearCollapseTimer();
          expandWidget();
          if (activeKind === "polaroid") {
            requestPhotoForIndex(activeCardIndex);
          }
          return;
        }

        if (state === "expanded" && (activePolaroidSlots.includes(index) || isClickedPolaroid)) {
          event.stopPropagation();
          clearCollapseTimer();
          activeCardIndex = index;
          activeKind = "polaroid";
          requestPhotoForIndex(index);
          return;
        }

        if (state === "expanded" && activeStickySlots.includes(index)) {
          event.stopPropagation();
          clearCollapseTimer();
          activeCardIndex = index;
          activeKind = "sticky";
          const editor = canvas.children[index]?.querySelector(".editor-layer");
          if (editor) {
            editor.focus();
            const end = editor.value.length;
            editor.setSelectionRange(end, end);
          }
          return;
        }
      }

      function handleViewportClick(event) {
        if (suppressNextBlankClick) {
          suppressNextBlankClick = false;
          return;
        }

        if (state !== "expanded") return;
        if (isPhotoPickerOpen || performance.now() < preventCollapseUntil) return;
        if (event.target.closest(".add-plus")) return;
        if (pointerDownOnVisibleElement || isPointOnVisibleElement(event.clientX, event.clientY)) return;
        collapseWidget();
      }

      function handleGlobalPointerDown(event) {
        pointerDownOnVisibleElement = state === "expanded" && isPointOnVisibleElement(event.clientX, event.clientY);
      }

      function handleGlobalClick(event) {
        handleViewportClick(event);
        pointerDownOnVisibleElement = false;
      }

      function openPreview(index) {
        if (state !== "expanded") return;
        selectedCard = cards[index];
        const [title, text, kicker] = selectedCard;
        previewKicker.textContent = kicker;
        previewTitle.textContent = title;
        previewText.textContent =
          `${text} The prototype keeps this panel deliberately simple: selection gives the fragment a readable place without reorganizing the field or snapping the canvas to a prescribed route.`;
        preview.classList.add("is-open");
      }

      function hidePreview() {
        preview.classList.remove("is-open");
        selectedCard = null;
      }

      function applyPhotoFile(targetIndex, file) {
        if (!file || !/^image\/(png|jpeg)$/.test(file.type)) return;
        const photoUrl = URL.createObjectURL(file);
        const previousUrl = photoUrls.get(targetIndex);
        if (previousUrl) URL.revokeObjectURL(previousUrl);
        photoUrls.set(targetIndex, photoUrl);
        chosenPhotoUrl = photoUrl;
        const targetCard = canvas.children[targetIndex];
        const photo = targetCard?.querySelector(".polaroid-photo");
        if (photo) photo.src = photoUrl;
      }

      async function requestPhotoForIndex(targetIndex) {
        photoTargetIndex = targetIndex;
        isPhotoPickerOpen = true;
        preventCollapseUntil = performance.now() + 60 * 1000;
        suppressNextBlankClick = true;
        clearCollapseTimer();

        if (window.showOpenFilePicker) {
          try {
            const [handle] = await window.showOpenFilePicker({
              multiple: false,
              types: [
                {
                  description: "PNG or JPEG image",
                  accept: {
                    "image/png": [".png"],
                    "image/jpeg": [".jpg", ".jpeg"],
                  },
                },
              ],
            });
            if (!handle) return;
            applyPhotoFile(targetIndex, await handle.getFile());
            return;
          } catch (error) {
            if (error?.name === "AbortError") return;
          } finally {
            isPhotoPickerOpen = false;
            preventCollapseUntil = performance.now() + photoPickerSettleDelay;
            suppressNextBlankClick = true;
          }
        }

        photoInput.value = "";
        photoInput.click();
        window.addEventListener("focus", () => {
          isPhotoPickerOpen = false;
          preventCollapseUntil = performance.now() + photoPickerSettleDelay;
          suppressNextBlankClick = true;
        }, { once: true });
      }

      function clearLongPressTimer() {
        window.clearTimeout(longPressTimer);
        longPressTimer = 0;
      }

      function getCardIndexFromEvent(event) {
        const card = event.target.closest(".card");
        if (!card) return null;
        const index = Number(card.dataset.index);
        return Number.isFinite(index) ? index : null;
      }

      function beginElementPress(event) {
        const index = getCardIndexFromEvent(event);
        if (index === null || !addedCardIndexes.includes(index) || event.target.closest(".editor-layer")) return false;

        pressCardIndex = index;
        clearLongPressTimer();
        longPressTimer = window.setTimeout(() => {
          if (pressCardIndex !== index || state !== "expanded") return;
          isElementDragging = true;
          elementDragIndex = index;
          isDragging = false;
          dragInput = null;
          velocityX = 0;
          velocityY = 0;
          targetVelocityX = 0;
          targetVelocityY = 0;
          suppressNextBlankClick = true;
          clearCollapseTimer();
          viewport.classList.remove("is-dragging");
          const card = canvas.children[index];
          card.classList.add("is-element-dragging");
          card.style.zIndex = 120;
          card.style.transform = `translate3d(0px, 0px, 0) rotate(${cards[index][7]}deg) scale(${Number(cards[index][8]) + 0.08})`;
        }, elementLongPressDelay);

        return true;
      }

      function onWheel(event) {
        event.preventDefault();
        if (!canPan()) {
          return;
        }
        lastWheelTime = performance.now();
        clearCollapseTimer();
        targetVelocityX += event.deltaX * wheelForce;
        targetVelocityY += event.deltaY * wheelForce;
      }

      function onPointerDown(event) {
        if (event.target.closest(".editor-layer")) return;
        if (!canPan()) {
          return;
        }
        if (event.button !== 0) return;
        if (isDragging || isElementDragging || pressCardIndex !== null) return;
        currentPointerX = event.clientX;
        currentPointerY = event.clientY;
        lastPointerX = event.clientX;
        lastPointerY = event.clientY;
        lastPointerTime = performance.now();
        pointerTravel = 0;
        suppressNextBlankClick = false;
        dragInput = event.pointerId !== undefined ? "pointer" : "mouse";

        if (beginElementPress(event)) {
          return;
        }

        isDragging = true;
        viewport.classList.add("is-dragging");
        if (event.pointerId !== undefined) viewport.setPointerCapture(event.pointerId);
        velocityX = 0;
        velocityY = 0;
        targetVelocityX = 0;
        targetVelocityY = 0;
      }

      function onPointerMove(event) {
        if (!isDragging && pressCardIndex === null && !isElementDragging) return;

        const now = performance.now();
        const deltaX = event.clientX - lastPointerX;
        const deltaY = event.clientY - lastPointerY;
        const elapsed = Math.max(16, now - lastPointerTime);
        pointerTravel += Math.hypot(deltaX, deltaY);
        if (pointerTravel > 6) suppressNextBlankClick = true;

        if (pressCardIndex !== null && !isElementDragging && pointerTravel > 8) {
          clearLongPressTimer();
          pressCardIndex = null;
        }

        if (isElementDragging && elementDragIndex !== null) {
          if (dragInput === "pointer" && event.pointerId === undefined) return;
          if (dragInput === "mouse" && event.pointerId !== undefined) return;
          cards[elementDragIndex][3] += deltaX;
          cards[elementDragIndex][4] += deltaY;
          positionCard(elementDragIndex);
          lastPointerX = event.clientX;
          lastPointerY = event.clientY;
          lastPointerTime = now;
          currentPointerX = event.clientX;
          currentPointerY = event.clientY;
          clearCollapseTimer();
          return;
        }

        if (!isDragging) {
          lastPointerX = event.clientX;
          lastPointerY = event.clientY;
          lastPointerTime = now;
          return;
        }
        if (dragInput === "pointer" && event.pointerId === undefined) return;
        if (dragInput === "mouse" && event.pointerId !== undefined) return;

        positionX += deltaX;
        positionY += deltaY;
        velocityX = (deltaX / elapsed) * 16 * dragVelocityBoost;
        velocityY = (deltaY / elapsed) * 16 * dragVelocityBoost;

        lastPointerX = event.clientX;
        lastPointerY = event.clientY;
        lastPointerTime = now;
      }

      function onPointerUp(event) {
        const releasedCardIndex = getCardIndexFromEvent(event) ?? pressCardIndex;
        clearLongPressTimer();
        pressCardIndex = null;

        if (isElementDragging) {
          if (dragInput === "pointer" && event.pointerId === undefined) return;
          if (dragInput === "mouse" && event.pointerId !== undefined) return;
          if (elementDragIndex !== null) {
            const draggedCard = canvas.children[elementDragIndex];
            draggedCard?.classList.remove("is-element-dragging");
            if (draggedCard) applyExpandedCardTransform(draggedCard, elementDragIndex);
          }
          isElementDragging = false;
          elementDragIndex = null;
          dragInput = null;
          if (event.pointerId !== undefined) viewport.releasePointerCapture(event.pointerId);
          return;
        }

        if (!isDragging && state === "expanded" && releasedCardIndex !== null && pointerTravel <= 6) {
          const releasedCard = canvas.children[releasedCardIndex];
          const releasedTapedSrc = releasedCard?.querySelector(".taped-shape")?.getAttribute("src") ?? "";
          const releasedStickySrc = releasedCard?.querySelector(".sticky-shape")?.getAttribute("src") ?? "";
          const isReleasedPolaroid = activePolaroidSlots.includes(releasedCardIndex) || releasedTapedSrc.includes("polaroid.svg") || releasedStickySrc.includes("polaroid.svg");
          if (isReleasedPolaroid) {
            activeCardIndex = releasedCardIndex;
            activeKind = "polaroid";
            requestPhotoForIndex(releasedCardIndex);
            suppressNextBlankClick = true;
            if (event.pointerId !== undefined) viewport.releasePointerCapture(event.pointerId);
            return;
          }
        }

        if (!isDragging) return;
        if (dragInput === "pointer" && event.pointerId === undefined) return;
        if (dragInput === "mouse" && event.pointerId !== undefined) return;
        isDragging = false;
        dragInput = null;
        viewport.classList.remove("is-dragging");
        if (event.pointerId !== undefined) viewport.releasePointerCapture(event.pointerId);
      }

      function animate() {
        if (state === "expanded" && performance.now() < expandedSyncUntil) {
          applyExpandedTransforms();
        }

        velocityX += (targetVelocityX - velocityX) * damping;
        velocityY += (targetVelocityY - velocityY) * damping;

        positionX += velocityX;
        positionY += velocityY;

        velocityX *= friction;
        velocityY *= friction;
        targetVelocityX *= friction;
        targetVelocityY *= friction;

        if (Math.abs(velocityX) < 0.001) velocityX = 0;
        if (Math.abs(velocityY) < 0.001) velocityY = 0;
        if (Math.abs(targetVelocityX) < 0.001) targetVelocityX = 0;
        if (Math.abs(targetVelocityY) < 0.001) targetVelocityY = 0;

        canvas.style.transform = `translate3d(${positionX}px, ${positionY}px, 0)`;
        requestAnimationFrame(animate);
      }

      cards.forEach(createCard);
      pickDefaultSticky();
      randomizeStackOrder();
      setWidgetState("collapsed");
      applyStackTransforms();

      viewport.addEventListener("wheel", onWheel, { passive: false });
      viewport.addEventListener("pointerdown", onPointerDown);
      viewport.addEventListener("pointermove", onPointerMove);
      viewport.addEventListener("pointerup", onPointerUp);
      viewport.addEventListener("pointercancel", onPointerUp);
      viewport.addEventListener("mousedown", onPointerDown);
      window.addEventListener("pointerdown", handleGlobalPointerDown, true);
      window.addEventListener("click", handleGlobalClick, true);
      window.addEventListener("mousemove", onPointerMove);
      window.addEventListener("mouseup", onPointerUp);
      viewport.addEventListener("mouseleave", scheduleReturnFromWidgetLeave);
      viewport.addEventListener("pointerleave", scheduleReturnFromWidgetLeave);
      window.addEventListener("mousemove", trackWidgetPointer);
      window.addEventListener("pointermove", trackWidgetPointer);
      addPlus.addEventListener("click", beginChoosing);
      photoInput.addEventListener("change", () => {
        const file = photoInput.files?.[0];
        isPhotoPickerOpen = false;
        preventCollapseUntil = performance.now() + photoPickerSettleDelay;
        suppressNextBlankClick = true;
        if (!file) return;
        const targetIndex = photoTargetIndex ?? activeCardIndex;
        applyPhotoFile(targetIndex, file);
        photoTargetIndex = null;
      });
      closePreview.addEventListener("click", hidePreview);
      window.addEventListener("resize", () => {
        setWidgetState(state);
        if (state === "collapsed" || state === "collapsing") applyStackTransforms();
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") hidePreview();
      });

      window.readingCanvasDebug = {
        get state() {
          return {
            positionX,
            positionY,
            velocityX,
            velocityY,
            targetVelocityX,
            targetVelocityY,
            state,
            selectedCard: selectedCard?.[0] ?? null,
          };
        },
      };

      requestAnimationFrame(animate);
    </script>
  </body>
</html>
